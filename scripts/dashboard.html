<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Usage Analyzer</title>
<style>
:root{--bg:#fff;--fg:#111;--dim:#666;--line:#e3e3e3;--bar:#3b82f6;--card:#fafafa}
@media(prefers-color-scheme:dark){:root{--bg:#111316;--fg:#e8e8e8;--dim:#9aa0a6;--line:#2a2e33;--bar:#60a5fa;--card:#181b1f}}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}
main{max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
p.sub{color:var(--dim);margin:0 0 20px}
select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
table{width:100%;border-collapse:collapse;margin-top:16px;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--dim);font-weight:500;font-size:13px;cursor:pointer}
.wrap{overflow-x:auto}
.bar{height:6px;background:var(--bar);border-radius:3px;min-width:2px}
.tool{font-size:12px;color:var(--dim)}
.good{color:#16a34a}.warn{color:#d97706}
.empty{color:var(--dim);padding:40px 0;text-align:center}
</style>
<main>
<h1>Usage Analyzer</h1>
<p class="sub">Shared Claude Max / Codex usage across the team.</p>
<select id="range">
  <option value="7">last 7 days</option>
  <option value="30" selected>last 30 days</option>
  <option value="90">last 90 days</option>
  <option value="3650">all time</option>
</select>
<div class="wrap"><table id="t"></table></div>
<div id="empty" class="empty" hidden>No data yet. Run <code>python3 collect.py</code> on a machine.</div>
</main>
<script>
const n = x => (x||0).toLocaleString();
const COLS = [
  ['user','user', r=>`${r.user} <span class="tool">${r.tool}</span>`],
  ['total tokens','total_tokens', r=>n(r.total_tokens)],
  ['share','share', r=>`<div class="bar" style="width:${r.share}%"></div>`],
  ['sessions','sessions', r=>n(r.sessions)],
  ['prompts','prompts', r=>n(r.prompts)],
  ['tokens/prompt','tpp', r=>n(Math.round(r.tpp))],
  ['cache hit','cache', r=>`<span class="${r.cache>=70?'good':r.cache<40?'warn':''}">${r.cache.toFixed(0)}%</span>`],
  ['tools/prompt','tools', r=>r.tools.toFixed(1)],
  ['prompts/session','pps', r=>r.pps.toFixed(1)],
  ['output tokens','output_tokens', r=>n(r.output_tokens)],
  ['hours','hours', r=>r.hours.toFixed(1)],
  ['last seen','last_seen', r=>(r.last_seen||'').slice(0,16).replace('T',' ')],
];
let sortKey='total_tokens', desc=true, rows=[];

function derive(d){
  const max = Math.max(1, ...d.by_user.map(r=>r.total_tokens));
  return d.by_user.map(r=>{
    const cached = r.cache_read_tokens, fresh = r.input_tokens + r.cache_write_tokens;
    return Object.assign({}, r, {
      share: 100*r.total_tokens/max,
      tpp: r.prompts ? r.total_tokens/r.prompts : 0,
      cache: (cached+fresh) ? 100*cached/(cached+fresh) : 0,
      tools: r.prompts ? r.tool_calls/r.prompts : 0,
      pps: r.sessions ? r.prompts/r.sessions : 0,
      hours: (r.active_minutes||0)/60,
    });
  });
}

function render(){
  const t = document.getElementById('t');
  document.getElementById('empty').hidden = rows.length > 0;
  rows.sort((a,b)=>{const x=a[sortKey],y=b[sortKey];
    const c = typeof x === 'string' ? String(x).localeCompare(String(y)) : (x-y); return desc?-c:c;});
  t.innerHTML = '<tr>' + COLS.map(([h,k])=>`<th data-k="${k}">${h}</th>`).join('') + '</tr>'
    + rows.map(r=>'<tr>'+COLS.map(([,,f])=>`<td>${f(r)}</td>`).join('')+'</tr>').join('');
  t.querySelectorAll('th').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; desc = k===sortKey ? !desc : true; sortKey=k; render();});
}

async function load(){
  const days = +document.getElementById('range').value;
  const since = new Date(Date.now()-days*864e5).toISOString().slice(0,10);
  const r = await fetch('/api/stats?since='+since);
  rows = derive(await r.json());
  render();
}
document.getElementById('range').onchange = load;
load();
</script>
